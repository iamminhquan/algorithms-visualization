name: Đồng bộ dev với main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward dev lên commit của main
        run: git push origin "${GITHUB_SHA}:refs/heads/dev"
