name: Đồng bộ dev với main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      # Cần đủ lịch sử để git biết commit hiện tại của dev là tổ tiên của main; clone nông (mặc định depth 1) làm push bị từ chối với "fetch first".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward dev lên commit của main
        run: git push origin "${GITHUB_SHA}:refs/heads/dev"
