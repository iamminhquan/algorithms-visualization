name: Kiểm tra cơ bản

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Push mới lên cùng nhánh thì huỷ lượt chạy cũ, chỉ giữ kết quả của commit mới nhất.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cài dependency
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Sinh kiểu route
        run: bunx next typegen

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test
